name: Q-Mini CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile C++ primitive
        run: bash scripts/build_native_kernel.sh
      - name: Run tests
        run: pytest -q
      - name: Audit smoke model
        run: python -m qmini.cli audit --config configs/qmini_smoke.json
